apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "outbox-worker"
  labels:
    image-uploader.dev/phase: "application"
    app.kubernetes.io/part-of: "image-uploader"
    app.kubernetes.io/component: "outbox-worker"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "outbox-worker"
  template:
    metadata:
      labels:
        app: "outbox-worker"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        -
          name: "outbox-worker"
          image: "image-uploader-outbox-worker:dev"
          imagePullPolicy: "IfNotPresent"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
          envFrom:
            -
              configMapRef:
                name: "app-config"
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_DB
