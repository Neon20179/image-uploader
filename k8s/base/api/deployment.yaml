apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "api"
  labels:
    image-uploader.dev/phase: "application"
    app.kubernetes.io/part-of: "image-uploader"
    app.kubernetes.io/component: "api"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "api"
  template:
    metadata:
      labels:
        app: "api"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        -
          name: "api"
          image: "image-uploader-api:dev"
          imagePullPolicy: "IfNotPresent"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
          envFrom:
            -
              configMapRef:
                name: "app-config"
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_DB
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MINIO_SECRET_KEY
          ports:
            -
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: "/readyz"
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: "/healthz"
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: "/healthz"
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
