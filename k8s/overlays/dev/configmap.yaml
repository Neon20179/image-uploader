apiVersion: builtin
kind: ConfigMapGenerator
metadata:
  name: app-config
name: app-config
behavior: merge
literals:
  - "POSTGRES_HOST=postgres"
  - "KAFKA_HOST=kafka"
  - "OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317"
  - "MINIO_ENDPOINT=minio:9000"
  - "DEV_INGRESS_PORT=18088"
  - "MINIO_PUBLIC_ENDPOINT=storage.localhost:PORT"
  - "MINIO_PUBLIC_SECURE=false"
  - "MINIO_BASE_URL=http://storage.localhost:PORT"
  - "LOGGER_LEVEL=debug"
  - "CORS_ALLOWED_ORIGINS=http://web.localhost:PORT"
options:
  labels:
    image-uploader.dev/phase: infrastructure
    app.kubernetes.io/component: configuration
