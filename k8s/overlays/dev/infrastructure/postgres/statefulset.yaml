apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "postgres"
  labels:
    image-uploader.dev/phase: "infrastructure"
    app.kubernetes.io/part-of: "image-uploader"
    app.kubernetes.io/component: "postgres"
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: "postgres"
  template:
    metadata:
      labels:
        app: "postgres"
    spec:
      automountServiceAccountToken: false
      containers:
        -
          name: "postgres"
          image: "pgvector/pgvector:pg18"
          ports:
            -
              containerPort: 5432
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
          volumeMounts:
            -
              name: "data"
              mountPath: "/var/lib/postgresql"
          readinessProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          envFrom:
            -
              configMapRef:
                name: "app-config"
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_DB
  volumeClaimTemplates:
    -
      metadata:
        name: "data"
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "5Gi"
