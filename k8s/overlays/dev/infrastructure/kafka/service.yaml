apiVersion: "v1"
kind: "Service"
metadata:
  name: "kafka"
  labels:
    image-uploader.dev/phase: "infrastructure"
    app.kubernetes.io/part-of: "image-uploader"
    app.kubernetes.io/component: "kafka"
spec:
  selector:
    app: "kafka"
  publishNotReadyAddresses: true
  ports:
    -
      name: "tcp"
      port: 9092
      targetPort: 9092
  clusterIP: "None"
