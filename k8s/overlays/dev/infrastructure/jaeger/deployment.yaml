apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    image-uploader.dev/phase: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        app.kubernetes.io/name: jaeger
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jaeger
          image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
          readinessProbe:
            tcpSocket:
              port: ui
