apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafbat
  labels:
    image-uploader.dev/phase: application
    app.kubernetes.io/part-of: image-uploader
    app.kubernetes.io/component: kafbat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafbat
  template:
    metadata:
      labels:
        app: kafbat
    spec:
      automountServiceAccountToken: false
      containers:
        - name: kafbat
          image: docker.io/kafbat/kafka-ui:v1.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: image-uploader-dev
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka:9092
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
