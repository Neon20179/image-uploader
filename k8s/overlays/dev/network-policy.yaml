apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dev-namespace-ingress
  labels:
    image-uploader.dev/phase: infrastructure
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  labels:
    image-uploader.dev/phase: infrastructure
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [api, web, minio, jaeger, kafbat]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 3000
        - port: 8000
        - port: 9000
        - port: 16686
        - port: 8080
