apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: image-uploader-dev
resources:
  - ../../base
  - namespace.yaml
  - ingress/api.yaml
  - ingress/jaeger.yaml
  - ingress/kafbat.yaml
  - ingress/minio.yaml
  - ingress/web.yaml
  - network-policy.yaml
  - infrastructure/clip-models/persistentvolumeclaim.yaml
  - infrastructure/jaeger/deployment.yaml
  - infrastructure/jaeger/service.yaml
  - infrastructure/kafbat/deployment.yaml
  - infrastructure/kafbat/service.yaml
  - infrastructure/kafka/service.yaml
  - infrastructure/kafka/statefulset.yaml
  - infrastructure/minio/service.yaml
  - infrastructure/minio/statefulset.yaml
  - infrastructure/ocr-models/persistentvolumeclaim.yaml
  - infrastructure/postgres/service.yaml
  - infrastructure/postgres/statefulset.yaml
  - jobs/kafka-init.yaml
  - jobs/migrate.yaml
  - jobs/minio-init.yaml
generators:
  - configmap.yaml
  - secret.yaml
replacements:
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.DEV_INGRESS_PORT
    targets:
      - select:
          kind: ConfigMap
          name: app-config
        fieldPaths:
          - data.MINIO_PUBLIC_ENDPOINT
        options:
          delimiter: ":"
          index: 1
      - select:
          kind: ConfigMap
          name: app-config
        fieldPaths:
          - data.MINIO_BASE_URL
          - data.CORS_ALLOWED_ORIGINS
        options:
          delimiter: ":"
          index: 2
