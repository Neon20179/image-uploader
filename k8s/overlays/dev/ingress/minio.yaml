apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: minio-rate-limit
  labels:
    image-uploader.dev/phase: application
    app.kubernetes.io/part-of: image-uploader
spec:
  rateLimit:
    average: 60
    period: 1s
    burst: 120
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: image-uploader-minio
  labels:
    image-uploader.dev/phase: application
    app.kubernetes.io/part-of: image-uploader
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: image-uploader-dev-minio-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: storage.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
