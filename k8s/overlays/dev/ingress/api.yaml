apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-rate-limit
  labels:
    image-uploader.dev/phase: application
    app.kubernetes.io/part-of: image-uploader
spec:
  rateLimit:
    average: 10
    period: 1s
    burst: 20
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: image-uploader-api
  labels:
    image-uploader.dev/phase: application
    app.kubernetes.io/part-of: image-uploader
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: image-uploader-dev-api-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: api.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
